<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="e2bg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e30"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
    <linearGradient id="sunset" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A78BFA" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#e2bg)"/>
  <!-- Mountain landscape watercolor -->
  <g transform="translate(0, 30)">
    <!-- Sky gradient -->
    <rect x="30" y="30" width="240" height="180" rx="8" fill="url(#sunset)" opacity="0.5"/>
    <!-- Sun -->
    <circle cx="200" cy="70" r="25" fill="#A78BFA" opacity="0.35"/>
    <circle cx="200" cy="70" r="18" fill="#A78BFA" opacity="0.25"/>
    <!-- Mountains - back -->
    <path d="M30 210 L80 100 L120 150 L170 80 L220 130 L270 90 L270 210 Z" fill="#7C3AED" opacity="0.2"/>
    <!-- Mountains - front -->
    <path d="M30 210 L90 130 L140 170 L190 110 L240 160 L270 140 L270 210 Z" fill="#06B6D4" opacity="0.15"/>
    <!-- Water reflection -->
    <rect x="30" y="195" width="240" height="20" rx="4" fill="#06B6D4" opacity="0.08"/>
    <!-- Stars -->
    <circle cx="80" cy="50" r="1.5" fill="#f0f0f5" opacity="0.5"/>
    <circle cx="130" cy="45" r="1" fill="#f0f0f5" opacity="0.4"/>
    <circle cx="160" cy="55" r="1.5" fill="#f0f0f5" opacity="0.6"/>
    <circle cx="240" cy="48" r="1" fill="#f0f0f5" opacity="0.3"/>
  </g>
  <text x="150" y="275" text-anchor="middle" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13" font-weight="500">"Mountain Watercolor"</text>
</svg>
