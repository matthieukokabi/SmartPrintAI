<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none">
  <defs>
    <linearGradient id="e1bg" x1="0" y1="0" x2="300" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1e30"/>
      <stop offset="100%" stop-color="#141420"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="16" fill="url(#e1bg)"/>
  <!-- Geometric wolf - minimalist -->
  <g transform="translate(75, 50)">
    <!-- Head outline -->
    <path d="M75 20 L20 80 L40 180 L75 200 L110 180 L130 80 Z" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0.8"/>
    <!-- Inner lines -->
    <path d="M75 20 L75 200" stroke="#A78BFA" stroke-width="1" opacity="0.3"/>
    <path d="M75 20 L40 180" stroke="#06B6D4" stroke-width="1" opacity="0.3"/>
    <path d="M75 20 L110 180" stroke="#06B6D4" stroke-width="1" opacity="0.3"/>
    <!-- Eyes -->
    <circle cx="55" cy="100" r="5" fill="#06B6D4" opacity="0.7"/>
    <circle cx="95" cy="100" r="5" fill="#06B6D4" opacity="0.7"/>
    <!-- Nose -->
    <path d="M70 130 L75 140 L80 130 Z" fill="#A78BFA" opacity="0.6"/>
    <!-- Ears -->
    <path d="M20 80 L35 20 L55 60" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
    <path d="M130 80 L115 20 L95 60" fill="none" stroke="#A78BFA" stroke-width="1.5" opacity="0.6"/>
  </g>
  <!-- Label -->
  <text x="150" y="275" text-anchor="middle" fill="#9ca3af" font-family="Inter, sans-serif" font-size="13" font-weight="500">"Geometric Wolf"</text>
</svg>
